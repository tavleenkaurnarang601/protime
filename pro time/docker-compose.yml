services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pro_time_tracker
      POSTGRES_USER: protime
      POSTGRES_PASSWORD: protime
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protime -d pro_time_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://protime:protime@postgres:5432/pro_time_tracker?schema=public
      JWT_SECRET: development-only-change-before-production-123
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_URL: http://localhost:4000 } }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
