services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pro_time_tracker
      POSTGRES_USER: protime
      POSTGRES_PASSWORD: protime
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protime -d pro_time_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: development-only-change-before-production-please
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgresql://protime:protime@postgres:5432/pro_time_tracker
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: